title: Operation Phantom Store Backend API Access

id: OPS-002

status: experimental

description: Detects access to the shared backend API observed across multiple campaign domains.

author: Hugh Chanetsa

logsource:

  category: proxy

detection:

  selection:

    url|contains:

      - /tiny-shop/v1/

      - /site/config

      - /member/member/index

      - /shop/product/my-product

      - /index/index

  condition: selection

level: high

tags:

  - attack.t1071

  - operation_phantom_store